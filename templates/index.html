<!DOCTYPE html>
<html>
<head>
    <title>SmartCalc Calculator</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 50px auto; padding: 20px; }
        .calculator { background: #f0f0f0; padding: 30px; border-radius: 10px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        #result { background: white; padding: 15px; margin-top: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>🧮 SmartCalc</h1>
        <input type="number" id="num1" placeholder="Enter first number" step="any">
        <input type="number" id="num2" placeholder="Enter second number (if needed)" step="any">
        <select id="operation">
            <option value="add">Add (+)</option>
            <option value="subtract">Subtract (-)</option>
            <option value="multiply">Multiply (×)</option>
            <option value="divide">Divide (÷)</option>
            <option value="power">Power (^)</option>
            <option value="sqrt">Square Root (√)</option>
        </select>
        <button onclick="calculate()">Calculate</button>
        <div id="result"></div>
    </div>

    <script>
        async function calculate() {
            const a = document.getElementById('num1').value;
            const b = document.getElementById('num2').value;
            const operation = document.getElementById('operation').value;
            
            const response = await fetch('/calculate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({operation, a, b})
            });
            
            const data = await response.json();
            const resultDiv = document.getElementById('result');
            
            if (data.error) {
                resultDiv.innerHTML = `<span style="color:red">Error: ${data.error}</span>`;
            } else {
                resultDiv.innerHTML = `<h2>Result: ${data.result}</h2>`;
            }
        }
    </script>
</body>
</html>
